version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore"
    groups:
      # One batched PR for the whole dependency tree instead of dozens of tabs.
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 2
