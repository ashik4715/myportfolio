name: Build & CI

on:
  push:
    branches: [source, main]
  pull_request:
    branches: [source, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deployment: GitHub Pages only (npm run deploy: gh-pages -b master -d build).
      # Vercel intentionally unused.
